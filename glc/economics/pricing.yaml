    input: 2.00
    output: 10.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    batch_multiplier: 0.5
    quality: 0.57
  claude-opus-5:
    provider: anthropic
    input: 5.00
    output: 25.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    batch_multiplier: 0.5
    quality: 0.61
  gpt-5.6-luna:
    provider: openai
    input: 1.00
    output: 6.00
    cache_read_multiplier: 0.1
    batch_multiplier: 0.5
    quality: 0.50
  gpt-5.6-terra:
    provider: openai
    input: 2.50
    output: 15.00
    cache_read_multiplier: 0.1
    batch_multiplier: 0.5
    quality: 0.55
  gpt-5.6-sol:
    provider: openai
    input: 5.00
    output: 30.00
    cache_read_multiplier: 0.1
    batch_multiplier: 0.5
    quality: 0.59

# ── Glob fallbacks, matched in order ────────────────────────────────────────
# A new point release (gemini-3.2-flash-lite) is priced sanely before anyone
# gets round to adding it above.
patterns:
  - match: "*:free"
    input: 0.0
    output: 0.0
    quality: 0.35
  - match: "gemini-*-flash-lite*"
    input: 0.25
    output: 1.50
    cache_read_multiplier: 0.25
    batch_multiplier: 0.5
    quality: 0.60
  - match: "gemini-*-flash*"
    input: 0.50
    output: 3.00
    cache_read_multiplier: 0.25
    batch_multiplier: 0.5
    quality: 0.68
  - match: "gemini-*-pro*"
    input: 2.00
    output: 12.00
    cache_read_multiplier: 0.25
    batch_multiplier: 0.5
    quality: 0.76
  - match: "claude-*"
    input: 2.00
    output: 10.00
    cache_read_multiplier: 0.1
    cache_write_multiplier: 1.25
    batch_multiplier: 0.5
    quality: 0.57
  - match: "*nemotron*"
    input: 0.0
    output: 0.0
    quality: 0.40

# ── v3 per-provider table, kept verbatim as the backward-compatible floor ───
# Reached only when nothing above matched. These are the exact numbers
# glc_v3's pricing.PRICING_USD_PER_MTOK carried.
providers:
  gemini:
    input: 0.0
    output: 0.0
  nvidia:
    input: 0.0
    output: 0.0
  groq:
    input: 0.15
    output: 0.75
