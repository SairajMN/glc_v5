  # Local via Ollama — never charged, but priced at 0 explicitly so the report
  # says "free because local" rather than "unpriced".
  gemma4:31b:
    provider: ollama
    input: 0.0
    output: 0.0
    quality: 0.42
  microsoft/Phi-4-mini-instruct:
